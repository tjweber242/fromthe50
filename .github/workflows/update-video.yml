name: Update Latest YouTube Video
 
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
 
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Fetch latest video ID
        id: getvideo
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import re
          import os
 
         channel_id = "UCeF1IGA4WIuuxrxGI0xxuTA"
 
          # Try RSS feed first
          urls = [
            f"https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}",
            f"https://www.youtube.com/channel/{channel_id}/videos",
          ]
 
          video_id = None
          for url in urls:
            try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              content = urllib.request.urlopen(req, timeout=10).read().decode("utf-8")
              print(f"Fetched {url}, length: {len(content)}")
 
              # Try multiple patterns
              patterns = [
                r'<yt:videoId>([A-Za-z0-9_-]{11})</yt:videoId>',
                r'watch\?v=([A-Za-z0-9_-]{11})',
                r'/videos/([A-Za-z0-9_-]{11})',
              ]
              for pat in patterns:
                m = re.search(pat, content)
                if m:
                  video_id = m.group(1)
                  print(f"Found video ID: {video_id}")
                  break
              if video_id:
                break
            except Exception as e:
              print(f"Error fetching {url}: {e}")
 
          if not video_id:
            print("ERROR: Could not find video ID")
            exit(1)
 
          # Write to GitHub output
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"video_id={video_id}\n")
          PYEOF
 
      - name: Update index.html with new video ID
        run: |
          VIDEO_ID="${{ steps.getvideo.outputs.video_id }}"
          echo "Updating with video ID: $VIDEO_ID"
          sed -i "s|youtube.com/embed/[A-Za-z0-9_-]*|youtube.com/embed/${VIDEO_ID}|g" index.html
          grep "youtube.com/embed" index.html
 
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes — already up to date."
          else
            git commit -m "Auto-update: latest YouTube episode"
            git push
          fi
 
